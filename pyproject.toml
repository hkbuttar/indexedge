[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indexedge"
version = "0.1.0"
description = "S&P 500 index replication and smart-beta construction: optimized sampling, ML-based tracking, regime-conditional and liquidity-aware backtests."
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
